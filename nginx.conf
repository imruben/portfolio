server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/xml;

    # Hashed build assets are immutable — cache them hard
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Long cache for other static assets (fonts, images)
    location ~* \.(?:woff2?|ttf|otf|png|jpe?g|webp|avif|svg|ico|pdf)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Serve the site; fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
